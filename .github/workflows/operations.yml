name: Operations

on:
  schedule:
    - cron: '17 4 * * *'
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_cuda:
        description: Run CUDA tests on a self-hosted cuda runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCFD_ROOT: ${{ github.workspace }}/contrib/scfd

jobs:
  cpu:
    if: github.event_name != 'schedule'
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [test-hierarchy, test-glued, test-algebra, test-io, test-multiprecision, test-backend, test-rect, test-dense, check-headers]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: make -j2 ${{ matrix.target }}

  sanitizers:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: make test-hierarchy test-glued test-product test-rect test-dense EXTRA_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
        env:
          ASAN_OPTIONS: detect_leaks=1

  mpi:
    if: github.event_name != 'schedule'
    name: Rectangular and product spaces / MPI / ${{ matrix.ranks }} ranks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ranks: [1, 2, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: make test-rect-mpi test-product-mpi MPI_NP=${{ matrix.ranks }} MPIEXEC_FLAGS=--oversubscribe OMP_NUM_THREADS=2

  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda
    runs-on: [self-hosted, linux, cuda]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: make -j2 test-cuda CONFIG_FILE=build_configs/config_cuda.inc

  latest-dependencies:
    name: Latest dependencies / CPU and MPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Select designated dependency branch tips
        run: |
          git submodule foreach '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch") &&
            git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          '
          git submodule update --init --remote --no-fetch --checkout
          git rev-parse HEAD
          git submodule status
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev openmpi-bin libopenmpi-dev
      - name: Verify latest dependencies without changing pins
        run: |
          make -j2 test-cpu test-multiprecision check-headers test-rect-mpi test-product-mpi \
            BUILD_DIR=build/latest MPI_NP=2 MPIEXEC_FLAGS=--oversubscribe OMP_NUM_THREADS=2
